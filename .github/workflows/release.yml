# Builds WarcraftXL.dll + wxl-patcher.exe and publishes them as a GitHub Release on every push to
# v1.2 (the current SDK line). The job runs the same commands a developer runs locally (build.ps1),
# so a green run means the documented local build works.
#
# d3d9.dll (the render proxy) is a separate, feature-specific injection mechanism and is not part of
# this release: the base install is wxl-patcher.exe adding the WarcraftXL.dll import to a user's own
# client copy. No client binary (Wow.exe, patched or not) is ever built or published here.
#
# Versioning is automatic and nothing has to be tagged by hand. SERIES is the only number anyone
# edits, and only when a release is worth calling a new one; the patch number is the commit count.
name: Build and Release

on:
  push:
    branches: [v1.2]
  pull_request:
    branches: [v1.2]
  workflow_dispatch:

permissions:
  contents: read

env:
  SERIES: '1.2'

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The patch number is the commit count, which a shallow clone cannot produce.
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          $count   = [int](git rev-list --count HEAD)
          $release = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/v1.2'
          $version = if ($release) { "$env:SERIES.$count" } else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $version

      - name: Configure (Win32)
        run: cmake -S . -B build -A Win32

      - name: Build WarcraftXL
        run: cmake --build build --config Release --target WarcraftXL --parallel

      - name: Build wxl-patcher
        run: cmake --build build --config Release --target wxl-patcher --parallel

      - name: Stage dist/
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build\Release\WarcraftXL.dll" -Destination "dist\WarcraftXL.dll"
          Copy-Item "build\Release\wxl-patcher.exe" -Destination "dist\wxl-patcher.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: wxl-core-${{ steps.v.outputs.version }}
          path: |
            dist/WarcraftXL.dll
            dist/wxl-patcher.exe
          if-no-files-found: error

  # Every push to v1.2 becomes a release, tag included. The tag is created by this job from the
  # version above rather than pushed by hand, and a tag created with GITHUB_TOKEN does not start
  # another run, so there is no loop to break.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/v1.2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wxl-core-*
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: WarcraftXL v${{ needs.build.outputs.version }}
          body: Built from ${{ github.sha }}
          files: |
            WarcraftXL.dll
            wxl-patcher.exe
          generate_release_notes: true
          prerelease: false
